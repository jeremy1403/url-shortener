services:
  backend:
    image: 207639009184.dkr.ecr.ap-southeast-1.amazonaws.com/url-shortener-backend:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: url_shortener
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 7d
      BASE_URL: https://jeremiah-url-shortener.duckdns.org
    expose:
      - "4000"

  frontend:
    image: 207639009184.dkr.ecr.ap-southeast-1.amazonaws.com/url-shortener-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  certbot_www:
  certbot_conf: